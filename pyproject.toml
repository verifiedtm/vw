[project]
name = "vw"
version = "0.1.0"
description = "A declarative video workbench powered by ffmpeg"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE.txt"]
dependencies = ["pillow>=11"]

[project.scripts]
vw = "vw:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
